name: b3_organ_waveunet_poly
display_name: B3 Organ Effect (Wave-U-Net, polyphonic)
version: "0.1.0"
short_description: Wave-U-Net trained to transform guitar into Hammond B3 organ character.
long_description: >
  A causal Wave-U-Net trained on paired guitar and Hammond B3 organ audio derived
  from GuitarSet. Input is clean DI guitar; output approximates the timbral character
  of a Hammond B3 through a rotary speaker.
technical_description: >
  Causal Wave-U-Net: 3-level encoder (stride-2 Conv1d, kernel 15), dilated TCN
  bottleneck (8 layers, channels 128), skip-connected decoder. ~200k parameters.
  Bottleneck receptive field covers the full 4096-sample training window.
  Trained with MSE + multi-scale spectral loss + mel spectrogram loss.
tags: [guitar, organ, timbral transfer, Wave-U-Net]
template: reaper/b3_organ_v2.rpp
output_dir: data/rendered/b3_organ_v2
sample_rate: 44100
bit_depth: 32
duration_scale: 0.4
min_duration_s: 0.05
onset_offset_s: 0.010
monophonic_only: false
model_type: waveunet
channels: 16
depth: 3
kernel_size: 15
bottleneck_layers: 8
